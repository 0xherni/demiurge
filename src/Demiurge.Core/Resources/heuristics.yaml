      installer_patterns: ['setup', 'install', 'unins', 'update', 'updater', '\.tmp\\', '\\is-[a-z0-9]+\.tmp', '\\ns[a-z0-9]+\.tmp', 'msiexec', 'vc_redist', 'dotnet', 'directx', '\\\{[0-9a-f-]{36}\}\\']

